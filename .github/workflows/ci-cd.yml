name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  validate:
    name: Lint, test, and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    # 22 is what the Docker image runs; 24 is what current developer machines default to.
    # better-sqlite3 ships prebuilt binaries for both, and testing both catches a native
    # binding mismatch in CI instead of on someone's laptop.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

  docker:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app for Docker context
        run: pnpm build

      - name: Build Docker image for smoke test
        run: docker build -t solo-leveling-smoke .

      - name: Smoke test Docker image
        run: |
          cid=$(docker run -d \
            -e API_HOST=0.0.0.0 \
            -e API_PORT=3333 \
            -e DATABASE_PATH=/tmp/solo-leveling.sqlite \
            -e SKIP_DISCORD_LOGIN=true \
            -e DISCORD_TOKEN=placeholder \
            -e DISCORD_CLIENT_ID=placeholder \
            -e TRACKED_GUILD_ID=placeholder \
            -e TRACKED_CHANNEL_IDS=placeholder \
            -e API_AUTH_TOKEN=smoke-test-token \
            -p 3333:3333 \
            solo-leveling-smoke)
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3333/api/health; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$cid"
            exit 1
          fi

          # The image is the artifact that gets deployed to a public URL, so assert that the
          # auth guard is actually wired up there and not only in unit tests.
          anonymous=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/api/daily)
          authorized=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer smoke-test-token' http://127.0.0.1:3333/api/daily)
          echo "anonymous=$anonymous authorized=$authorized"
          if [ "$anonymous" != "401" ] || [ "$authorized" != "200" ]; then
            docker logs "$cid"
            exit 1
          fi
